services:
  db:
    image: mysql:8.4
    container_name: ingressos_db
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER:-ingressos_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ingressos_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ingressos_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1
          -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    container_name: ingressos_backend
    restart: unless-stopped
    environment:
      FLASK_APP: run.py
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-ingressos_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ingressos_pass}
      DB_NAME: ${MYSQL_DATABASE:-ingressos_db}
      CORS_ORIGINS: http://localhost:5173
      MODO_DEMONSTRACAO: ${MODO_DEMONSTRACAO:-true}
      COFRE_SECRET_KEY: ${COFRE_SECRET_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      USAR_GEMINI: ${USAR_GEMINI:-false}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-ingressos_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ingressos_pass}
      DB_NAME: ${MYSQL_DATABASE:-ingressos_db}
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy

  db_test:
    image: mysql:8.4
    profiles: [testes]
    environment:
      MYSQL_ROOT_PASSWORD: teste_root
      MYSQL_USER: teste
      MYSQL_PASSWORD: teste_pass
      MYSQL_DATABASE: ingressos_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=teste_pass mysql -h 127.0.0.1 -uteste ingressos_test -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  testes:
    build: ./backend
    profiles: [testes]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    environment:
      DB_HOST: db_test
      DB_PORT: 3306
      DB_USER: teste
      DB_PASSWORD: teste_pass
      DB_NAME: ingressos_test
      SECRET_KEY: chave_apenas_para_testes
      MODO_DEMONSTRACAO: "true"
    volumes:
      - ./backend:/app
    depends_on:
      db_test:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ingressos_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
