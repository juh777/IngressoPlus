# Standalone production stack. Do not merge with docker-compose.yml.
name: ingressoplus-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend_environment
  FLASK_APP: run.py
  FLASK_DEBUG: "0"
  SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo de ambiente}
  COFRE_SECRET_KEY: ${COFRE_SECRET_KEY:?Defina uma chave Fernet persistente}
  DB_HOST: db
  DB_PORT: "3306"
  DB_USER: ${MYSQL_USER:?Defina MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD}
  DB_NAME: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE}
  CORS_ORIGINS: ${PUBLIC_ORIGIN:?Defina PUBLIC_ORIGIN como http://IP_PUBLICO}
  # Hosting does not add a payment gateway. Keep the existing simulator working.
  MODO_DEMONSTRACAO: "true"

x-backend: &backend
  image: ingressoplus-backend:aws
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  environment: *backend_environment
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 1536m
    command:
      - --innodb-buffer-pool-size=512M
      - --max-connections=60
      - --performance-schema=OFF
      - --mysqlx=0
    environment:
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1
          -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s
    logging: *logging

  init_db:
    <<: *backend
    restart: "no"
    mem_limit: 256m
    command: [flask, init-db]
    networks: [database]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    mem_limit: 640m
    environment:
      <<: *backend_environment
      USAR_GEMINI: ${USAR_GEMINI:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    networks: [web, database]
    depends_on:
      db:
        condition: service_healthy
      init_db:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).close()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 45s

  worker:
    <<: *backend
    restart: unless-stopped
    mem_limit: 256m
    command: [python, worker.py]
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
      init_db:
        condition: service_completed_successfully

  frontend:
    image: ingressoplus-frontend:aws
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/nginx-health]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

networks:
  web:
  database:
    internal: true

volumes:
  mysql_data:
